# Prüft jeden Pull Request und jeden Push: Lint, Typen, Format, Unit-Tests, Build und Smoke-Test.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          # Electron (Desktop-App, M8) wird für Web-Build und Tests nicht gebraucht.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
